# Default configuration - balanced for general purpose formula discovery

# Population settings
populationSize = 1000
hallOfFameSize = 3

# Enable all basic operations
enableAddition = true
enableSubtraction = true
enableMultiplication = true
enableDivision = true
enablePower = true
enableModulo = true

# Enable most function types
enableTrigonometric = true
enableHyperbolic = true
enableExponential = true
enableLogarithmic = true
enableRounding = true
enableRootFunctions = true

# Reasonable constant range
minConstantValue = -1000
maxConstantValue = 1000

# Formula complexity constraints
maxFormulaDepth = 10
maxFormulaNodes = 40

# Fitness weights - balanced
accuracyWeight = 0.7
complexityWeight = 0.1
rangeConsistencyWeight = 0.1
monotonicityWeight = 0.1

# Complexity penalty
complexityPenaltyFactor = 0.001

# Stagnation handling
stagnationThreshold = 200
aggressiveStagnationThreshold = 100
randomInjectionCount = 50

# Stopping criteria
maxIterations = 200000
stopOnPerfectMatch = true
stopOnHallOfFameFull = true

# Progress reporting
progressReportInterval = 1000
verboseLogging = false
