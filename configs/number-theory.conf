# Configuration for number theory problems (like prime formulas)
# Maximizes search space and allows complex operations

# Population settings - larger for complex search
populationSize = 2000
hallOfFameSize = 10

# Enable all operations
enableAddition = true
enableSubtraction = true
enableMultiplication = true
enableDivision = true
enablePower = true
enableModulo = true  # Essential for number theory

# Enable all function types
enableTrigonometric = true
enableHyperbolic = true
enableExponential = true
enableLogarithmic = true
enableRounding = true  # floor/ceil useful for number theory
enableRootFunctions = true

# Wide range for constants
minConstantValue = -10000
maxConstantValue = 10000

# Allow more complex formulas
maxFormulaDepth = 12
maxFormulaNodes = 50

# Fitness weights - pure accuracy focus
accuracyWeight = 0.95
complexityWeight = 0.05
rangeConsistencyWeight = 0.0
monotonicityWeight = 0.0

# Lower complexity penalty - we expect complex formulas
complexityPenaltyFactor = 0.0005

# Stagnation handling - more aggressive for hard problems
stagnationThreshold = 300
aggressiveStagnationThreshold = 150
randomInjectionCount = 100

# Stopping criteria - longer search
maxIterations = 500000
stopOnPerfectMatch = true
stopOnHallOfFameFull = false

# Progress reporting
progressReportInterval = 2000
verboseLogging = true
