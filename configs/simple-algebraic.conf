# Configuration for simple algebraic problems (polynomials, basic arithmetic)
# This disables complex functions to speed up search for simple formulas

# Population settings
populationSize = 1000
hallOfFameSize = 5

# Enable only basic arithmetic operations
enableAddition = true
enableSubtraction = true
enableMultiplication = true
enableDivision = true
enablePower = true
enableModulo = false

# Disable complex functions
enableTrigonometric = false
enableHyperbolic = false
enableExponential = false
enableLogarithmic = false
enableRounding = false
enableRootFunctions = true  # Keep square root for polynomials

# Constrain constants to reasonable integers
minConstantValue = -100
maxConstantValue = 100

# Formula complexity constraints
maxFormulaDepth = 5
maxFormulaNodes = 20

# Fitness weights - prioritize accuracy and simplicity
accuracyWeight = 0.8
complexityWeight = 0.2
rangeConsistencyWeight = 0.0
monotonicityWeight = 0.0

# Complexity penalty
complexityPenaltyFactor = 0.002

# Stopping criteria
maxIterations = 100000
stopOnPerfectMatch = true

# Progress reporting
progressReportInterval = 500
verboseLogging = false
