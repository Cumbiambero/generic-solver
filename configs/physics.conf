# Configuration for physics problems
# Enables all mathematical operations needed for physics formulas

# Population settings
populationSize = 1500
hallOfFameSize = 5

# Enable all basic operations
enableAddition = true
enableSubtraction = true
enableMultiplication = true
enableDivision = true
enablePower = true
enableModulo = false

# Enable scientific functions
enableTrigonometric = true
enableHyperbolic = false
enableExponential = true
enableLogarithmic = true
enableRounding = false
enableRootFunctions = true

# Allow constants and pi/e
minConstantValue = -1000
maxConstantValue = 1000

# Formula complexity constraints
maxFormulaDepth = 8
maxFormulaNodes = 30

# Fitness weights - balance accuracy and consistency
accuracyWeight = 0.7
complexityWeight = 0.1
rangeConsistencyWeight = 0.1
monotonicityWeight = 0.1

# Complexity penalty
complexityPenaltyFactor = 0.001

# Stopping criteria
maxIterations = 200000
stopOnPerfectMatch = true

# Progress reporting
progressReportInterval = 1000
verboseLogging = false
